<script>
const obliczPoleProstokata = (szerokosc, wysokosc) => szerokosc * wysokosc;

const szerokosc = 5;
const wysokosc = 8;
const pole = obliczPoleProstokata(szerokosc, wysokosc);

console.log(`Pole prostokąta o wymiarach ${szerokosc} x ${wysokosc} wynosi ${pole}`);
</script>
